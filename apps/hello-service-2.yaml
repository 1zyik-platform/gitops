apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "hello-service-2"
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/1zyik-platform/hello-service-2.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: "hello-service-2"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
